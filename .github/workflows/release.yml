name: Release

# Run from the Actions tab on main and pick which part of the version to bump. Bumps CFBundleShortVersionString and
# CFBundleVersion in project.yml, builds, signs and notarizes the app, then commits and tags the bump and publishes the
# DMG, the update archive and the signed appcast.xml the in-app updater reads.
# Secrets (release environment): DEVELOPER_ID_P12_BASE64 and DEVELOPER_ID_P12_PASSWORD (the Developer ID Application
# certificate), NOTARY_KEY_P8_BASE64, NOTARY_KEY_ID and NOTARY_ISSUER_ID (the App Store Connect API key for notarization)
# and SPARKLE_PRIVATE_KEY (the update signing key, from Sparkle's `generate_keys -x`).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version to bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  SIGN_IDENTITY: "Developer ID Application: Md Abue Ammar (J656U8XZ93)"

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    environment: release
    steps:
      - uses: actions/checkout@v7

      - name: Bump the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          current=$(awk -F'"' '/CFBundleShortVersionString:/ {print $2}' project.yml)
          build=$(awk -F'"' '/CFBundleVersion:/ {print $2}' project.yml)
          IFS=. read -r major minor patch <<< "$current"
          case "$BUMP" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            patch) version="$major.$minor.$((patch + 1))" ;;
          esac
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists"
            exit 1
          fi
          sed -i '' \
            -e "s/CFBundleShortVersionString: \"$current\"/CFBundleShortVersionString: \"$version\"/" \
            -e "s/CFBundleVersion: \"$build\"/CFBundleVersion: \"$((build + 1))\"/" \
            project.yml
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version (build $((build + 1)))"

      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" --jq .body > "$RUNNER_TEMP/notes.md"

      - name: Install tools
        run: brew install xcodegen

      - name: Import the Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password=$(uuidgen)
          trap 'rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/DeveloperIDG2CA.cer"' EXIT
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          # The runner trusts only the G1 intermediate; codesign can't build the certificate's chain without G2.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          base64 --decode <<< "$CERTIFICATE_P12" > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      - name: Configure signing
        run: |
          cat > Config/Signing.local.xcconfig <<XCCONFIG
          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY = Developer ID Application
          OTHER_CODE_SIGN_FLAGS = --timestamp
          XCCONFIG

      - name: Build, notarize and write the appcast
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          export NOTARY_KEY="$RUNNER_TEMP/AuthKey.p8" SPARKLE_KEY_FILE="$RUNNER_TEMP/sparkle.key"
          trap 'rm -f "$NOTARY_KEY" "$SPARKLE_KEY_FILE"' EXIT
          base64 --decode <<< "$NOTARY_KEY_P8" > "$NOTARY_KEY"
          printf '%s\n' "$SPARKLE_KEY" > "$SPARKLE_KEY_FILE"
          scripts/release.sh "$RUNNER_TEMP/notes.md"

      - name: Commit and tag the version
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project.yml App/Info.plist
          git commit -m "Release $TAG"
          git tag "$TAG"
          git push --atomic origin HEAD:main "$TAG"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" \
            dist/ScreenRecorder.dmg dist/ScreenRecorder.zip dist/appcast.xml
