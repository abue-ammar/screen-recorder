name: CI

# Run by hand from the Actions tab; pushes and pull requests don't build the app.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build
        run: |
          xcodegen generate
          xcodebuild -project ScreenRecorder.xcodeproj -scheme ScreenRecorder -configuration Debug \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM= build
