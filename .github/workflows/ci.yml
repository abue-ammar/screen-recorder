name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip ci') }}
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build
        run: |
          xcodegen generate
          xcodebuild -project ScreenRecorder.xcodeproj -scheme ScreenRecorder -configuration Debug \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM= build

  scripts:
    name: Scripts
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip ci') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh
        run: sudo apt-get install -y zsh
      - name: Check syntax
        run: |
          for f in scripts/*.sh; do
            if head -1 "$f" | grep -q zsh; then zsh -n "$f"; else bash -n "$f"; fi
            echo "ok $f"
          done
      - name: ShellCheck
        run: shellcheck --shell=bash --severity=warning scripts/*.sh
