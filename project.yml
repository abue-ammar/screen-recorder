name: ScreenRecorder
options:
  deploymentTarget:
    macOS: "27.0"
packages:
  SliceCore:
    path: .
  # In-app updates from the GitHub releases' signed appcast.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    ENABLE_HARDENED_RUNTIME: YES
  configs:
    Release:
      # Notarization rejects the debugger entitlement Xcode otherwise injects.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
targets:
  ScreenRecorder:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - path: App/Resources
        optional: true
    dependencies:
      - package: SliceCore
      - package: Sparkle
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Screen Recorder
        CFBundleName: Screen Recorder
        CFBundleShortVersionString: "0.2.8"
        CFBundleVersion: "10"
        LSApplicationCategoryType: public.app-category.video
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        # Updates (Sparkle): the signed appcast attached to the latest GitHub release, which skips drafts and
        # prereleases. Both the feed and the update archive must be signed with the EdDSA key this public key matches.
        SUFeedURL: https://github.com/abue-ammar/screen-recorder/releases/latest/download/appcast.xml
        SUPublicEDKey: LF43Wyk/+Gn9Oza5ADLk3xkrB2Mzj/6AXsKSOfjH5fk=
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
        SUEnableAutomaticChecks: true
        SUAllowsAutomaticUpdates: true
        SUAutomaticallyUpdate: false
        SUScheduledCheckInterval: 14400
        # Projects are `.slice` packages (a folder Finder shows as one file) that Screen Recorder opens and edits.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Screen Recorder Project
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSTypeIsPackage: true
            LSItemContentTypes:
              - $(PRODUCT_BUNDLE_IDENTIFIER).project
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER).project
            UTTypeDescription: Screen Recorder Project
            UTTypeConformsTo:
              - com.apple.package
              - public.composite-content
            UTTypeTagSpecification:
              public.filename-extension:
                - slice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abueammar.screenrecorder
        PRODUCT_NAME: Screen Recorder
        GENERATE_INFOPLIST_FILE: NO
        # App/ScreenRecorder.entitlements, or App/ScreenRecorder-SelfSigned.entitlements for self-signed builds (Config/Signing.xcconfig).
        # Keep the two the same apart from library validation.
        CODE_SIGN_ENTITLEMENTS: $(APP_ENTITLEMENTS)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
